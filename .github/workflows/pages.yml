name: Build and deploy portal

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate bilingual content and categories
        run: node scripts/validate-content.mjs

      - name: Generate GA4 article ranking when configured
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_CREDENTIALS_B64: ${{ secrets.GA4_CREDENTIALS_B64 }}
        shell: bash
        run: |
          if [ -n "$GA4_PROPERTY_ID" ] && [ -n "$GA4_CREDENTIALS_B64" ]; then
            printf '%s' "$GA4_CREDENTIALS_B64" | base64 --decode > "$RUNNER_TEMP/ga4-credentials.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/ga4-credentials.json"
            npm install --no-save --no-package-lock @google-analytics/data
            node scripts/fetch-popular-posts.mjs
          else
            echo "GA4 reporting credentials are not configured; using recent-article fallback."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
