title: ABK Lung Health Education Portal
title_ur: اے بی کے پھیپھڑوں کی صحت کا تعلیمی پورٹل
description: Clear, practical lung-health education, articles, resources, and respiratory-care connections from Abdullah Bin Khurram.
description_ur: عبداللہ بن خرم کی جانب سے پھیپھڑوں کی صحت سے متعلق واضح اور عملی معلومات، مضامین، وسائل اور نگہداشت سے رابطے۔
author: Abdullah Bin Khurram
url: "https://abdullah-bin-khurram.github.io"
baseurl: "/blogs"
lang: en

timezone: Asia/Karachi
permalink: /articles/:title/
markdown: kramdown
excerpt_separator: "<!--more-->"

kramdown:
  input: GFM
  hard_wrap: false

collections:
  resources:
    output: true
    permalink: /:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Abdullah Bin Khurram
      author_ur: عبداللہ بن خرم
      published: true
  - scope:
      path: ""
      type: resources
    values:
      layout: resource

exclude:
  - README.md
  - worklist.md
  - oauth-worker
  - node_modules
  - vendor
  - downloads
  - scripts
